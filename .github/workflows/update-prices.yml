name: Auto-Update Model Prices

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync prices from LiteLLM
        env:
          SYNC_SUMMARY_FILE: /tmp/price_diff.md
        run: |
          chmod +x scripts/sync_prices.sh
          ./scripts/sync_prices.sh

      - name: Check for changes in prices.json
        id: diff
        run: |
          if git diff --quiet prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/auto-update-prices"
          git fetch origin "$BRANCH" 2>/dev/null || true
          git checkout -B "$BRANCH"
          git add prices.json
          git commit -m "chore: update model pricing"
          git push --force-with-lease origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            printf 'Automated daily pricing sync from LiteLLM.\n\n%s\n' "$(cat /tmp/price_diff.md 2>/dev/null || true)" | gh pr edit "$EXISTING_PR" --title "chore: update model pricing" --body-file -
          else
            printf 'Automated daily pricing sync from LiteLLM.\n\n%s\n' "$(cat /tmp/price_diff.md 2>/dev/null || true)" | gh pr create --base main --head "$BRANCH" --title "chore: update model pricing" --body-file -
          fi
